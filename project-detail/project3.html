<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="Detail project Social Media API oleh Ardhian.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <title>Project 3 - Social Media API</title>
  <link rel="stylesheet" href="../css/project-detail.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
  <header>
    <a href="../index.html" class="logo">Ardhian</a>
    <i id="menu-icon" class="fa-solid fa-bars"></i>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../about.html">About Me</a>
      <a href="../skills.html">Skills</a>
      <a href="../project.html" class="active">Project</a>
      <a href="../experience.html">Experience</a>
      <a href="../certificate.html">Certificates</a>
    </nav>
  </header>

  <section class="project-detail">
    <h1>Social Media API</h1>
    <div class="detail-tags">
      <span class="detail-tag">Node.js</span>
      <span class="detail-tag">REST API</span>
    </div>
    <p class="description">
      API sederhana untuk fitur posting, komentar, dan followers.
    </p>

    <div class="detail-visual blue">
      <i class="fa-solid fa-share-nodes"></i>
    </div>

    <div class="detail-note">
      <i class="fa-solid fa-circle-info"></i> Dokumentasi & repository lengkap untuk project ini akan segera ditambahkan.
    </div>

    <div class="project-links">
      <a href="https://github.com/ArdhianM6" target="_blank" class="btn">
        <i class="fa-brands fa-github"></i> Lihat Profil GitHub
      </a>
      <a href="../project.html" class="btn back-btn">← Kembali ke Project</a>
    </div>
  </section>

  <script>
    window.addEventListener("load", () => {
      document.body.classList.add("loaded");
    });
  </script>

  <script>
    // === Toggle Navbar (Mobile) ===
    const menuIcon = document.getElementById('menu-icon');
    const nav = document.querySelector('nav');
    if (menuIcon && nav) {
      menuIcon.onclick = () => nav.classList.toggle('active');

      // Tutup menu saat salah satu link diklik
      nav.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => nav.classList.remove('active'));
      });

      // Tutup menu saat klik di luar area nav/menu-icon
      document.addEventListener('click', (e) => {
        if (!nav.contains(e.target) && !menuIcon.contains(e.target)) {
          nav.classList.remove('active');
        }
      });
    }
  </script>

    <!-- ===== SCROLL TO TOP ===== -->
    <button id="scrollTopBtn" aria-label="Kembali ke atas" title="Kembali ke atas">
        <i class="fa-solid fa-arrow-up"></i>
    </button>
    <script>
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });
        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

</body>

</html>
